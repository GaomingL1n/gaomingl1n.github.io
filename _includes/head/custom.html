<!-- 随机背景：每次打开随机挑一张 images/ 下名为 backgroundN.* 的图片（如 background1.jpg、
     background2.png）。构建时自动枚举，新增这种命名的图片无需改任何代码。 -->
<script>
(function () {
  var BGS = [
    {% for f in site.static_files %}{% if f.basename matches '^background[0-9]*$' %}
    '{{ f.path }}',{% endif %}{% endfor %}
  ];
  var pick = BGS[Math.floor(Math.random() * BGS.length)];
  if (pick) {
    document.documentElement.style.setProperty('--bg', "url('" + pick + "')");
  }
})();
</script>
